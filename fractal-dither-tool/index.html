<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fractal Dither Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#FFFAF0;--ink:#111;--mute:#57534d;--line:#1114;--serif:'Instrument Serif',Georgia,serif;--sans:Lato,system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);overflow-x:clip}
.band{padding:clamp(20px,3vw,40px) max(4vw,16px)}
header.band{padding-bottom:12px}
h1{font:italic 400 clamp(36px,5vw,60px)/1.05 var(--serif);letter-spacing:-.02em;margin:0 0 6px}
header p{margin:0;color:var(--mute);max-width:62ch}
main{display:grid;grid-template-columns:minmax(270px,.85fr) minmax(0,1.4fr);background:var(--bg);max-width:1260px;margin-inline:auto}
.stage{position:relative;width:100%;max-width:750px;aspect-ratio:1;background:#fff;border:1px solid var(--line);border-radius:0;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.busy{position:absolute;right:10px;bottom:10px;background:#111;color:#fff;font-size:13px;padding:4px 10px;border-radius:99px;opacity:0;transition:opacity .2s}
.busy.on{opacity:.85}
aside{display:flex;flex-direction:column;gap:16px;padding:clamp(18px,3vw,38px)}
.meter{border-bottom:1px solid var(--line);padding-bottom:16px}
.dval{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.dval b{font-size:clamp(40px,5vw,56px);font-weight:900;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.dval span{font-weight:700}
.scale{position:relative;height:34px;margin:12px 0 4px}
.track{position:absolute;left:0;right:0;top:10px;height:10px;background:color-mix(in srgb,var(--ink) 10%,transparent);border-radius:5px}
.zone{position:absolute;top:10px;height:10px;background:color-mix(in srgb,var(--ink) 30%,transparent);border-radius:3px}
.zone i{position:absolute;top:13px;left:50%;transform:translateX(-50%);font-style:normal;font-size:13px;color:var(--mute);white-space:nowrap}
.mark{position:absolute;top:2px;width:4px;height:26px;margin-left:-2px;background:var(--ink);border-radius:2px;transition:left .25s}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:14px}
.status{font-size:14px;margin:6px 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px}
button,.seg label{font:inherit;font-size:13px;min-height:38px;padding:0 10px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button:hover,.seg label:hover{border-color:var(--ink)}
button:focus-visible,.seg input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
button:active{transform:translateY(1px)}
fieldset{border:0;padding:4px 0 0;margin:0}
legend{font-weight:700;font-size:14px;padding:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:inline-flex;align-items:center;padding:0;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{padding:0 9px;line-height:36px;border-radius:3px}
.seg input:checked+span{background:var(--ink);color:var(--bg)}
.ctl{display:grid;grid-template-columns:6.5em minmax(0,1fr) 3.2em;align-items:center;gap:10px;min-height:40px}
.ctl output{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--ink);margin-top:-8px;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--ink)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--bg)}
input[type=range]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--ink)}
.ctl.is-inactive{visibility:hidden}
@media(max-width:680px){main{grid-template-columns:minmax(0,1fr)}.preview{grid-row:1;border-inline-start:0}}
@media(prefers-reduced-motion:reduce){.mark{transition:none}.busy{transition:none}}
.preview{display:grid;place-items:center;align-content:start;gap:12px;margin:0;padding:clamp(16px,3vw,38px);background:#000;border-inline-start:1px solid var(--line)}
.preview figcaption{color:#f2eadd;font-size:13px;text-align:center}
.embedded-tool{overflow:hidden}
.embedded-tool header{display:none}
@media(max-width:680px){main{grid-template-columns:minmax(0,1fr)}.preview{grid-row:1;border-inline-start:0}}
</style>
</head>
<body>
<header class="band">
<h1>Fractal Dither Tool</h1>
<p>Apply dither and halftone patterns to this flower photo and see how each adjustment changes its estimated fractal dimension (D).</p>
</header>
<main>
<aside aria-label="Pattern controls">
<div class="meter">
<div class="dval"><b id="dNum">–</b><span id="dLab">Calculating</span></div>
<div class="scale" id="scale"><div class="track"></div><div class="mark" id="mark"></div></div>
<div class="ends"><span>1.0 Sparse</span><span>2.0 Dense</span></div>
<div class="status" id="status"></div>
<div class="row">
<button data-target="low">Low 1.2–1.3</button>
<button data-target="mid">Medium 1.4–1.5</button>
<button data-target="high">High 1.6–1.7</button>
</div>
</div>
<fieldset>
<legend>Pattern</legend>
<div class="seg" id="modes"></div>
</fieldset>
<fieldset>
<legend>Adjustments</legend>
<div class="ctl"><label for="cell">Dot size</label><input type="range" id="cell" min="2" max="24" step="1" value="6"><output></output></div>
<div class="ctl"><label for="bri">Brightness</label><input type="range" id="bri" min="-1" max="1" step="0.01" value="0"><output></output></div>
<div class="ctl"><label for="con">Contrast</label><input type="range" id="con" min="0.4" max="3" step="0.05" value="1.2"><output></output></div>
<div class="ctl"><label for="edge">Edge strength</label><input type="range" id="edge" min="0" max="1" step="0.01" value="0.2"><output></output></div>
<div class="ctl"><label for="grain">Grain</label><input type="range" id="grain" min="0" max="1" step="0.01" value="0.15"><output></output></div>
<div class="ctl" id="angRow"><label for="ang">Screen angle</label><input type="range" id="ang" min="0" max="90" step="1" value="45"><output></output></div>
<div class="row" style="margin-top:6px"><label class="chk"><input type="checkbox" id="inv"> Invert</label><label class="chk"><input type="checkbox" id="crop"> Circle crop</label></div>
</fieldset>
<div class="row">
<button class="primary" id="reseed">Regenerate</button>
<button id="reset">Reset</button>
</div>
</aside>
<figure class="preview">
<div class="stage"><canvas id="out" width="750" height="750" aria-label="Live pattern preview"></canvas><div class="busy" id="busy">Calculating</div></div>
<figcaption>Photo by Joy Shih</figcaption>
</figure>
</main>

function showD(D){$("dNum").textContent=D.toFixed(2);const [lab,msg]=band(D);$("dLab").textContent=lab;$("status").textContent=msg;$("mark").style.left=Math.max(0,Math.min(100,(D-1)*100))+"%"}
let toneDirty=true,raf=0;
function sync(){document.querySelectorAll(".ctl input[type=range]").forEach(r=>{r.value=st[r.id];r.nextElementSibling.textContent=(+st[r.id]).toFixed(r.step<1?2:0)});
 ["inv","crop"].forEach(k=>$(k).checked=st[k]);
 document.querySelectorAll("input[name=mode]").forEach(r=>r.checked=r.value===st.mode);
 $("angRow").classList.toggle("is-inactive",!(st.mode==="dots"||st.mode==="hlines"));
}
function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{if(toneDirty){buildTone();toneDirty=false}render(octx,st.bri);showD(dimension(out))})}
document.querySelectorAll(".ctl input[type=range]").forEach(r=>r.addEventListener("input",()=>{st[r.id]=+r.value;r.nextElementSibling.textContent=(+r.value).toFixed(r.step<1?2:0);schedule()}));
document.addEventListener("change",e=>{const t=e.target;
 if(t.name==="mode"){st.mode=t.value;sync();schedule()}
 else if(["inv","crop"].includes(t.id)){st[t.id]=t.checked;schedule()}});
$("reseed").addEventListener("click",()=>{seed=Math.floor(Math.random()*1e9);sync();schedule()});
$("reset").addEventListener("click",()=>{st={...DEF};seed=20261119;toneDirty=true;sync();schedule()});
const probe=offscreen(),pctx=probe.getContext("2d");
document.querySelectorAll("[data-target]").forEach(b=>b.addEventListener("click",()=>{const [a,c]=RANGES[b.dataset.target],goal=(a+c)/2;$("busy").classList.add("on");
 setTimeout(()=>{if(toneDirty){buildTone();toneDirty=false}const Dof=v=>{render(pctx,v);return dimension(probe)};
  let lo=-1,hi=1,dlo=Dof(lo),dhi=Dof(hi),msg="";
  if(dlo<goal){st.bri=lo;msg="With these settings, the highest estimate is D "+dlo.toFixed(2)+". Try a smaller dot size."}
  else if(dhi>goal){st.bri=hi;msg="With these settings, the lowest estimate is D "+dhi.toFixed(2)+". Try a larger dot size or lower contrast."}
  else{for(let i=0;i<14;i++){const m=(lo+hi)/2;Dof(m)>goal?lo=m:hi=m}st.bri=+((lo+hi)/2).toFixed(2)}
  sync();render(octx,st.bri);showD(dimension(out));if(msg)$("status").textContent=msg;$("busy").classList.remove("on")},30)}));
drawScale();
sync();
const photo = new Image();
photo.onload = () => {
 img = photo;
 toneDirty = true;
 schedule();
};
photo.src = DEFAULT_SRC;
}
if (window.parent !== window) {
 document.documentElement.classList.add("embedded-tool");
 const sendHeight = () => {
  window.parent.postMessage({type:"dither-tool-height", height:document.body.offsetHeight}, "*");
 };
 new ResizeObserver(sendHeight).observe(document.body);
 addEventListener("load", sendHeight);
}
</script>
</body>
</html>
